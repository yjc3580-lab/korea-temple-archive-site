<title>전통사찰 정보 아카이브</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=92ebb2aff71da2b87fbbac5c9d938232&libraries=clusterer&autoload=false"></script>
<style>
  :root{
    --bg:#12161c;
    --bg-raised:#181d25;
    --ink:#eef1f5;
    --ink-soft:#a6afbb;
    --line:#2a323d;
    --blue-50:#182335;
    --blue-100:#1f3350;
    --blue-600:#5b93de;
    --blue-700:#7fb0f2;
    --red-50:#301c1c;
    --red-500:#e0837e;
    --placeholder-bg:#1d2229;
    --radius:12px;
    --brand:#28d976;
    --brand-50:#12281c;
    --brand-dark:#1fae5e;
    --gold:#d9b26a;
    --gold-dark:#a5813e;
    --ridge-1:#0d1015;
    --ridge-2:#161b23;
    --ridge-3:#20272f;
    --shadow:0 8px 24px rgba(0,0,0,.35);
  }
  :root[data-theme="light"]{
    --bg:#ffffff;
    --bg-raised:#ffffff;
    --ink:#1c2430;
    --ink-soft:#5b6572;
    --line:#e4e8ee;
    --blue-50:#eef4fc;
    --blue-100:#dbe8fa;
    --blue-600:#2b5faa;
    --blue-700:#1f4d8f;
    --red-50:#fdeeee;
    --red-500:#c0433f;
    --placeholder-bg:#f4f4f4;
    --brand:#03c75a;
    --brand-50:#e7f9ee;
    --brand-dark:#029a46;
    --gold:#a5762f;
    --gold-dark:#7c5a24;
    --ridge-1:#dfe6ee;
    --ridge-2:#eef2f7;
    --ridge-3:#f7f9fb;
    --shadow:0 8px 24px rgba(20,30,50,.08);
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"HCR Dotum","HancomGothic","맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:15px; line-height:1.6;
  }
  a{color:inherit; text-decoration:none}
  header.top{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:10;
    background:var(--bg-raised); border-bottom:1px solid var(--line); box-shadow:var(--shadow);
    padding:12px 16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  }
  header.top .brand{font-size:17px; font-weight:800; color:var(--ink); white-space:nowrap; display:flex; align-items:center; gap:6px}
  header.top nav{display:flex; gap:2px; flex-wrap:wrap}
  header.top nav a{
    padding:9px 12px 7px; font-size:13.5px; color:var(--ink-soft); font-weight:600;
    border-bottom:2px solid transparent; transition:color .15s,border-color .15s;
  }
  header.top nav a:hover{color:var(--ink)}
  header.top nav a.active{color:var(--gold); border-bottom-color:var(--gold)}
  main{max-width:960px; margin:0 auto; padding:20px 16px 80px}
  .searchbar{
    display:flex; gap:8px; margin:6px 0 18px;
  }
  .searchbar input[type=text]{
    flex:1; padding:12px 14px; border:1.5px solid var(--line); border-radius:999px;
    background:var(--bg); color:var(--ink); font-size:15px;
  }
  .searchbar button, .btn{
    padding:12px 18px; border:none; border-radius:999px; background:var(--brand);
    color:#fff; font-weight:700; cursor:pointer; font-size:14px;
  }
  .btn.secondary{background:var(--brand-50); color:var(--brand-dark)}
  .btn.ghost{background:transparent; color:var(--ink-soft); border:1px solid var(--line)}
  #homeHero{
    text-align:center; padding:34px 12px 10px;
  }
  #homeHero .searchbar{
    max-width:560px; margin:14px auto 0;
  }
  #homeHero .searchbar input[type=text]{
    padding:15px 20px; font-size:16px; border-color:var(--brand)
  }
  #homeHero .searchbar button{padding:15px 24px}
  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin:18px 0}
  .stat-card{
    background:var(--blue-50); border-radius:var(--radius); padding:14px; text-align:center;
  }
  .stat-card b{display:block; font-size:22px; color:var(--blue-700)}
  .stat-card span{font-size:12.5px; color:var(--ink-soft)}
  h1{font-size:22px; margin:6px 0 4px}
  h2{font-size:19px; margin:22px 0 8px; color:var(--blue-700)}
  .muted{color:var(--ink-soft); font-size:13px}
  .filters{
    display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; align-items:center;
    background:var(--blue-50); padding:10px 12px; border-radius:var(--radius);
  }
  .filters select, .filters label{font-size:13px}
  .filters select{padding:7px 8px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink)}
  .result-count{font-size:13px; color:var(--ink-soft); margin:0 0 8px}
  ul.temple-list{list-style:none; margin:0; padding:0}
  ul.temple-list li{
    border-bottom:1px solid var(--line); padding:12px 4px;
  }
  ul.temple-list li a{display:flex; align-items:center; gap:10px}
  ul.temple-list li a:hover .t-name{color:var(--blue-600)}
  ul.temple-list li a .t-main{display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex:1; min-width:0}
  .t-thumb{
    width:40px; height:40px; border-radius:8px; object-fit:cover; flex:none;
    background:var(--placeholder-bg);
  }
  .t-name{font-weight:700; font-size:15px}
  .t-addr{font-size:12.5px; color:var(--ink-soft); flex:1; text-align:right}
  .badge{
    display:inline-block; font-size:11px; padding:2px 8px; border-radius:999px;
    background:var(--blue-100); color:var(--blue-700); margin-left:6px; font-weight:700;
  }
  .badge.placeholder{background:var(--placeholder-bg); color:var(--ink-soft)}
  .empty{padding:30px 10px; text-align:center; color:var(--ink-soft)}
  figure.temple-photo{margin:0 0 16px 0}
  figure.temple-photo img{
    width:100%; max-height:360px; object-fit:cover; border-radius:var(--radius);
    display:block; background:var(--placeholder-bg);
  }
  figure.temple-photo figcaption{font-size:11.5px; margin-top:6px; line-height:1.5}
  figure.temple-photo figcaption a{color:var(--blue-600); text-decoration:underline}
  .photo-linkout{
    display:block; margin:0 0 16px 0; padding:14px 16px; border-radius:var(--radius);
    background:var(--blue-50); border:1px solid var(--blue-100); text-decoration:none;
  }
  .photo-linkout .lo-title{color:var(--blue-700); font-weight:700; font-size:13.5px}
  .photo-linkout .lo-sub{color:var(--ink-soft); font-size:11.5px; margin-top:4px; line-height:1.5}
  .badge.linkout{background:var(--blue-50); color:var(--blue-700); border:1px solid var(--blue-100)}
  .pager{display:flex; justify-content:center; gap:6px; margin-top:16px; flex-wrap:wrap}
  .pager button{
    border:1px solid var(--line); background:var(--bg); color:var(--ink); padding:6px 11px;
    border-radius:8px; cursor:pointer; font-size:13px;
  }
  .pager button.on{background:var(--blue-600); color:#fff; border-color:var(--blue-600)}
  section.block{
    border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:14px;
    background:var(--blue-50);
  }
  section.block.ph{background:var(--placeholder-bg)}
  .history-text{white-space:pre-line; font-size:14.5px}
  .kv{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:14px}
  .kv b{color:var(--ink-soft); font-weight:600}
  .writing-tools{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px}
  textarea{
    width:100%; min-height:70px; padding:10px; border:1px solid var(--line); border-radius:10px;
    background:var(--bg); color:var(--ink); font-family:inherit; font-size:13.5px;
  }
  .tag-chip{
    display:inline-flex; align-items:center; gap:6px; background:var(--red-50); color:var(--red-500);
    padding:4px 10px; border-radius:999px; font-size:12.5px; font-weight:600; margin:2px 4px 2px 0;
  }
  .tag-chip button{border:none; background:none; color:inherit; cursor:pointer; font-size:12px}
  #map-svg-wrap{border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; background:var(--blue-50)}
  #map-svg-wrap svg{width:100%; height:auto; display:block}
  .dot{fill:var(--blue-600); cursor:pointer; opacity:.75}
  .dot:hover{fill:var(--red-500); opacity:1}
  #kakaoMap{width:100%; height:600px; border:1px solid var(--line); border-radius:var(--radius); background:var(--blue-50)}
  #kakaoDetailMap{width:100%; height:220px; border-radius:8px; background:var(--blue-50)}
  #kakaoVisitMap{width:100%; height:520px; border:1px solid var(--line); border-radius:var(--radius); background:var(--blue-50); margin-top:14px}
  .map-tooltip{
    position:fixed; pointer-events:none; background:var(--ink); color:var(--bg); font-size:12px;
    padding:5px 9px; border-radius:6px; transform:translate(-50%,-130%); display:none; z-index:50;
    white-space:nowrap;
  }
  footer.src{
    margin-top:40px; padding-top:16px; border-top:1px solid var(--line); font-size:12px; color:var(--ink-soft);
  }
  .note-banner{
    background:var(--red-50); color:var(--red-500); border-radius:10px; padding:10px 12px; font-size:12.5px; margin-bottom:14px;
  }
  [hidden]{display:none!important}

  header.top{padding:14px 20px}
  header.top nav{flex:1}
  .mypage-btn{white-space:nowrap}

  /* ---- 산사 능선 히어로 ---- */
  .mountain-hero{
    position:relative; border-radius:var(--radius); overflow:hidden; margin-bottom:6px;
    background:linear-gradient(180deg, var(--bg) 0%, var(--blue-50) 100%);
  }
  .ridge-svg{display:block; width:100%; height:auto}
  .hero-content{
    position:relative; padding:44px 28px 30px; text-align:center;
  }
  .hero-content .eyebrow{
    display:inline-block; font-size:12.5px; font-weight:700; letter-spacing:.04em;
    color:var(--gold); border:1px solid var(--gold); border-radius:999px; padding:4px 12px; margin-bottom:14px;
  }
  .hero-content h1{
    font-size:26px; line-height:1.45; margin:0 0 20px; color:var(--ink); font-weight:800;
  }
  .hero-search-row{
    display:flex; gap:8px; max-width:640px; margin:0 auto; flex-wrap:wrap; justify-content:center;
  }
  .hero-search-row select{
    padding:12px 10px; border-radius:10px; border:1px solid var(--line); background:var(--bg-raised); color:var(--ink); font-size:13.5px;
  }
  .hero-search-row input[type=text]{
    flex:1; min-width:180px; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
    background:var(--bg-raised); color:var(--ink); font-size:14px;
  }
  .hero-search-row button{white-space:nowrap}

  /* ---- 현판형 오늘의 사찰 + 갤러리 ---- */
  .today-row{display:grid; grid-template-columns:280px 1fr; gap:16px; margin:22px 0}
  @media (max-width:700px){ .today-row{grid-template-columns:1fr} }
  .today-plate{
    display:flex; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; background:var(--bg-raised);
  }
  .plate-bar{width:10px; background:linear-gradient(180deg, var(--gold) 0%, var(--brand) 100%); flex:none}
  .plate-body{padding:18px 16px; display:flex; flex-direction:column; gap:6px}
  .plate-label{font-size:11.5px; font-weight:700; color:var(--gold); letter-spacing:.03em}
  .plate-body h2{margin:2px 0 0; font-size:22px; color:var(--ink)}
  .plate-body .plate-meta{font-size:12.5px; color:var(--ink-soft); margin-bottom:8px}
  .plate-body .btn{align-self:flex-start; margin-top:auto}
  .gallery-strip{
    display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; scroll-snap-type:x proximity;
  }
  .gallery-card{
    flex:none; width:150px; scroll-snap-align:start; border-radius:10px; overflow:hidden;
    background:var(--bg-raised); border:1px solid var(--line); text-align:left;
  }
  .gallery-card img{width:100%; height:100px; object-fit:cover; display:block; background:var(--placeholder-bg)}
  .gallery-card .gc-name{display:block; padding:8px 10px 2px; font-size:13px; font-weight:700; color:var(--ink)}
  .gallery-card .gc-sub{display:block; padding:0 10px 10px; font-size:11.5px; color:var(--ink-soft)}

  /* ---- 처마 곡선 구분선 ---- */
  .section-divider{display:flex; justify-content:center; margin:30px 0}
  .section-divider svg{width:120px; height:16px; opacity:.55}

  /* ---- 지역 태그 클라우드 ---- */
  .region-cloud{display:flex; flex-wrap:wrap; gap:10px 14px; align-items:baseline; padding:18px 20px; border:1px solid var(--line); border-radius:var(--radius); background:var(--bg-raised)}
  .region-chip{color:var(--ink-soft); font-weight:700; white-space:nowrap}
  .region-chip:hover{color:var(--brand)}
  .region-chip b{font-weight:400; font-size:11px; color:var(--ink-soft); margin-left:2px}

  /* ---- 현판형 통계 밴드 ---- */
  .stat-band{
    display:flex; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; background:var(--bg-raised);
  }
  .stat-band-item{
    flex:1; text-align:center; padding:18px 8px; border-right:1px solid var(--line);
  }
  .stat-band-item:last-child{border-right:none}
  .stat-band-item b{display:block; font-size:21px; color:var(--gold)}
  .stat-band-item span{font-size:11.5px; color:var(--ink-soft)}

  /* ---- 먹선 타임라인 공지 ---- */
  .timeline{position:relative; margin:16px 0; padding-left:18px; border-left:2px solid var(--line)}
  .timeline-item{position:relative; padding:0 0 20px 16px}
  .timeline-item:last-child{padding-bottom:0}
  .timeline-item::before{
    content:''; position:absolute; left:-24px; top:3px; width:9px; height:9px; border-radius:50%;
    background:var(--brand); box-shadow:0 0 0 3px var(--bg-raised);
  }
  .timeline-item b{display:block; font-size:12.5px; color:var(--gold); margin-bottom:3px}
  .timeline-item p{margin:0; font-size:13.5px; line-height:1.6; color:var(--ink)}

  .placeholder-page{
    border:1.5px dashed var(--line); border-radius:var(--radius); padding:40px 24px; text-align:center;
  }
  .placeholder-page .ph-icon{font-size:34px; margin-bottom:10px}
  .placeholder-page h2{margin-top:0}
  .culture-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; margin-top:16px}
  .culture-card{border:1px solid var(--line); border-radius:var(--radius); padding:16px; background:var(--blue-50)}
  .culture-card b{display:block; margin-bottom:6px; color:var(--blue-700); font-size:15px}
  .culture-card span{font-size:13px; color:var(--ink-soft); line-height:1.6}

  /* ---- 불교 전통 문양 장식 (오방색 단청 띠 · 연화문 · 격자문) ---- */
  .motif-header{
    position:relative; overflow:hidden; border-radius:var(--radius); border:1px solid var(--line);
    padding:28px 24px 22px; margin-bottom:8px;
    background:linear-gradient(180deg, var(--blue-50) 0%, var(--bg) 100%);
  }
  .motif-header .lattice-decor{position:absolute; inset:0; width:100%; height:100%; opacity:.16; pointer-events:none}
  .motif-header h1{position:relative; margin:0 0 8px; display:flex; align-items:center; gap:8px}
  .motif-header p{position:relative; margin:0; max-width:640px}
  .dancheong-band{
    height:5px; border-radius:3px; margin:0 0 22px;
    background:linear-gradient(90deg,
      #2b5faa 0%, #2b5faa 20%, #c0433f 20%, #c0433f 40%,
      var(--gold) 40%, var(--gold) 60%, #e7e7e2 60%, #e7e7e2 80%,
      #2a2a2a 80%, #2a2a2a 100%);
    opacity:.85;
  }
  .lotus-icon{flex:none}
  .section-lead{display:flex; align-items:center; gap:8px; font-size:15px; font-weight:800; color:var(--ink); margin:26px 0 12px}
  .section-lead-body{font-size:13.5px; color:var(--ink-soft); line-height:1.75; margin:0}
  .ts-gallery{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px; margin:18px 0}
  .ts-gallery-item{position:relative; display:block; border-radius:10px; overflow:hidden; aspect-ratio:4/3; text-decoration:none; background:var(--placeholder-bg)}
  .ts-gallery-item img{width:100%; height:100%; object-fit:cover; display:block}
  .ts-gallery-item span{
    position:absolute; left:0; right:0; bottom:0; padding:16px 8px 6px; font-size:11.5px; font-weight:700; color:#fff;
    background:linear-gradient(0deg, rgba(0,0,0,.72), rgba(0,0,0,0)); text-shadow:0 1px 2px rgba(0,0,0,.6);
  }
  .ts-type-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px; margin-top:6px}
  .ts-type-card{
    border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; background:var(--bg-raised);
    display:flex; flex-direction:column; gap:6px;
  }
  .ts-type-card b{display:flex; align-items:center; gap:6px; font-size:14px; color:var(--ink)}
  .ts-type-card span{font-size:12.5px; color:var(--ink-soft); line-height:1.6}
  .ts-activity-grid{display:flex; flex-wrap:wrap; gap:8px; margin-top:4px}
  .ts-activity-chip{
    display:inline-flex; align-items:center; gap:5px; padding:7px 12px; border-radius:999px;
    background:var(--brand-50); color:var(--brand-dark); font-size:12.5px; font-weight:700;
  }
  .source-note{font-size:12px; color:var(--ink-soft); margin-top:16px}
  .quote-block{
    position:relative; border-left:3px solid var(--gold); padding:4px 0 4px 16px; margin:16px 0 22px;
    font-size:15.5px; color:var(--ink); font-style:italic; line-height:1.75;
  }
  .pilgrim-list{display:flex; flex-direction:column; gap:8px; margin-top:14px}
  .pilgrim-item{
    display:flex; align-items:center; gap:12px; padding:11px 14px; border:1px solid var(--line);
    border-radius:10px; background:var(--bg-raised);
  }
  .pilgrim-num{
    flex:none; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:var(--brand-50); color:var(--brand-dark); font-weight:800; font-size:12.5px;
  }
  .pilgrim-thumb{flex:none; width:34px; height:34px; border-radius:8px; object-fit:cover; background:var(--placeholder-bg)}
  .pilgrim-item .p-name{font-weight:700; color:var(--ink); font-size:14.5px}
  .pilgrim-item .p-region{font-size:12px; color:var(--ink-soft); margin-left:auto; white-space:nowrap}
  .pilgrim-item .p-goto{font-size:11.5px; font-weight:700; color:var(--blue-700); white-space:nowrap}
  a.pilgrim-item:hover{border-color:var(--brand)}
  .region-group{margin:22px 0}
  .region-group h3{
    display:flex; align-items:center; gap:6px; font-size:14.5px; color:var(--gold); margin:0 0 10px;
    padding-bottom:6px; border-bottom:1px solid var(--line); font-weight:800;
  }
  .temple-chip-grid{display:flex; flex-wrap:wrap; gap:8px}
  .temple-chip-link{
    display:inline-flex; align-items:center; gap:5px; padding:7px 12px 7px 7px; border-radius:999px;
    border:1px solid var(--line); background:var(--bg-raised); color:var(--ink); font-size:12.5px; font-weight:600;
    text-decoration:none;
  }
  .chip-thumb{flex:none; width:22px; height:22px; border-radius:50%; object-fit:cover; background:var(--placeholder-bg)}
  .temple-chip-link.no-link{padding-left:12px}
  .temple-chip-link:hover{border-color:var(--brand); color:var(--brand-dark)}
  .temple-chip-link.no-link{cursor:default; opacity:.7}
  .food-organ-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; margin-top:14px}
  .food-organ-card{
    border:1px solid var(--line); border-radius:var(--radius); padding:18px; background:var(--bg-raised);
    display:flex; flex-direction:column; gap:6px;
  }
  .food-organ-card b{font-size:15px; color:var(--ink)}
  .food-organ-card .fo-desc{font-size:12.5px; color:var(--ink-soft); line-height:1.6}
  .food-organ-card .fo-meta{font-size:12px; color:var(--ink-soft); line-height:1.7}
  .food-organ-card .fo-meta a{color:var(--blue-700)}
  .food-temple-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-top:14px}
  .food-temple-card{border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--red-50); text-decoration:none; display:block}
  .food-temple-card.has-photo{padding:0}
  .food-temple-card:not(.has-photo){padding:12px 14px}
  .ft-photo{width:100%; height:90px; object-fit:cover; display:block; background:var(--placeholder-bg)}
  .ft-body{padding:10px 12px 12px}
  .food-temple-card b{display:block; color:var(--ink); font-size:13.5px; margin-bottom:3px}
  .food-temple-card span{font-size:11.5px; color:var(--ink-soft)}
  .ts-badge{
    display:inline-block; margin-top:6px; font-size:10.5px; font-weight:700; color:var(--brand-dark);

const PROVINCES = Array.from(new Set(TEMPLES.map(t=>t.province).filter(Boolean))).sort();

// "오늘의 사찰"·홈 갤러리는 경기도·서울특별시 소재 사찰을 우선으로 노출합니다.
// 해당 지역에 사진이 있는 사찰이 없을 경우에만 전체 목록으로 대체합니다.
const FEATURED_PROVINCES = ['경기도', '서울특별시'];
const FEATURED_PHOTO_TEMPLES = PHOTO_TEMPLES.filter(t=>FEATURED_PROVINCES.includes(t.province));
const HOME_PHOTO_TEMPLES = FEATURED_PHOTO_TEMPLES.length>0 ? FEATURED_PHOTO_TEMPLES : PHOTO_TEMPLES;
function todaysTemple(){
  if(HOME_PHOTO_TEMPLES.length===0) return null;
  const now = new Date();
  const start = new Date(now.getFullYear(),0,0);
  const dayOfYear = Math.floor((now - start) / 86400000);
  return HOME_PHOTO_TEMPLES[dayOfYear % HOME_PHOTO_TEMPLES.length];
}
// 오늘의 사찰과 같은 날짜 로직으로 정해지는, 사진이 있는 사찰 갤러리(최대 4곳, 오늘의 사찰 다음 순번부터)
function homeGallery(n){
  if(HOME_PHOTO_TEMPLES.length===0) return [];
  const now = new Date();
  const start = new Date(now.getFullYear(),0,0);
  const dayOfYear = Math.floor((now - start) / 86400000);
  const count = Math.min(n, Math.max(0, HOME_PHOTO_TEMPLES.length-1));
  const out = [];
  for(let i=1;i<=count;i++){
    out.push(HOME_PHOTO_TEMPLES[(dayOfYear+i) % HOME_PHOTO_TEMPLES.length]);
  }
  return out;
}
// 지역(도)별 등록 사찰 수 — 태그 클라우드 크기 계산에 사용
function regionCounts(){
  const map = {};
  TEMPLES.forEach(t=>{ if(t.province) map[t.province] = (map[t.province]||0) + 1; });
  return PROVINCES.map(p=>({ province:p, count: map[p]||0 })).sort((a,b)=>b.count-a.count);
}

function extractYear(s){
  if(!s) return null;
  const m = String(s).match(/\d{3,4}/);
  return m ? parseInt(m[0],10) : null;
}

//    같은 계정의 다른 기기·브라우저에서도 이어서 볼 수 있게 동기화
function loadLocal(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; }
}
function saveLocal(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
}

  try{
    dbNS.collection('mypage').onSnapshot(snap=>{
      dbConnected = true;
      const nextCollection = [], nextNotes = {}, nextTags = {};
      snap.docs.forEach(d=>{
        const data = d.data() || {};
        dbCache[d.id] = data;
        if(data.collected) nextCollection.push(parseInt(d.id,10));
        if(data.note) nextNotes[d.id] = data.note;
        if(data.tags && data.tags.length) nextTags[d.id] = data.tags;
      });
      myCollection = nextCollection; myNotes = nextNotes; myTags = nextTags;
      saveLocal('temple_collection', myCollection);
      saveLocal('temple_notes', myNotes);
      saveLocal('temple_tags', myTags);
      refreshSyncBadges();
      const { name, arg } = currentRoute();
      if(name==='mypage') render();
      else if(name==='temple'){
        const id = parseInt(arg,10);
        renderTags(id);
        const btn = document.getElementById('collectBtn');
        if(btn){ btn.textContent = isCollected(id) ? '★ 컬렉션에서 제거' : '☆ 컬렉션에 담기'; btn.className = 'btn ' + (isCollected(id) ? '' : 'secondary'); }
        const noteArea = document.getElementById('noteArea');
        if(noteArea && document.activeElement !== noteArea) noteArea.value = getNote(id);
      }
    }, err=>{ dbConnected = false; refreshSyncBadges(); });
  }catch(e){ /* db 사용 불가 — localStorage만으로 계속 동작 */ }
}
initDb();

function dbWrite(idStr, patch){
  if(!dbNS) return;
  const merged = Object.assign({}, dbCache[idStr]||{}, patch);
  dbCache[idStr] = merged;
  dbNS.doc('mypage/' + idStr).set(merged).catch(()=>{ /* 다음 사용자 조작 시 재시도됨 */ });
}

function toggleCollect(id){
  const i = myCollection.indexOf(id);
  if(i>=0) myCollection.splice(i,1); else myCollection.push(id);
  saveLocal('temple_collection', myCollection);
  dbWrite(String(id), { collected: isCollected(id) });
}
function isCollected(id){ return myCollection.indexOf(id) >= 0; }

let noteSaveTimers = {};
function setNote(id, text){
  myNotes[id] = text; saveLocal('temple_notes', myNotes);
  clearTimeout(noteSaveTimers[id]);
  noteSaveTimers[id] = setTimeout(()=>{ dbWrite(String(id), { note: text }); }, 800);
}
function getNote(id){ return myNotes[id] || ''; }
function addTag(id, tag){
  tag = tag.trim(); if(!tag) return;
  const arr = myTags[id] || [];
  if(arr.indexOf(tag) === -1){
    arr.push(tag); myTags[id] = arr; saveLocal('temple_tags', myTags);
    dbWrite(String(id), { tags: arr });
  }
}
function removeTag(id, tag){
  const arr = (myTags[id] || []).filter(t=>t!==tag);
  myTags[id] = arr; saveLocal('temple_tags', myTags);
  dbWrite(String(id), { tags: arr });
}
function getTags(id){ return myTags[id] || []; }

function esc(s){
  if(s==null) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------------- 라우터 ----------------
function currentRoute(){
  const h = location.hash.replace(/^#\/?/, '');
  const path = h.split('?')[0]; // 물음표 뒤 쿼리스트링(예: ?province=경상북도)은 경로 판단에서 제외
  const parts = path.split('/').filter(Boolean);
  return { name: parts[0] || 'home', arg: parts[1] };
}

window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', ()=>{ if(!location.hash) location.hash = '#/home'; render(); });

function render(){
  const { name, arg } = currentRoute();
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active', a.dataset.r===name));
  const app = document.getElementById('app');
  if(name==='home') app.innerHTML = viewHome();
  else if(name==='search') { app.innerHTML = viewSearch(); wireSearch(); }
  else if(name==='map') { app.innerHTML = viewMap(); wireMap(); }
  else if(name==='temple') { app.innerHTML = viewDetail(parseInt(arg,10)); wireDetail(parseInt(arg,10)); }
  else if(name==='routes') app.innerHTML = viewRoutes();
  else if(name==='templestay') app.innerHTML = viewTemplestay();
  else if(name==='templefood') app.innerHTML = viewTemplefood();
  else if(name==='culture') app.innerHTML = viewCulture();
  else if(name==='visitmap') { app.innerHTML = viewVisitMap(); wireVisitMap(); }
  else if(name==='mypage') { app.innerHTML = viewMyPage(); wireMyPage(); }
  else if(name==='about') app.innerHTML = viewAbout();
  else app.innerHTML = '<div class="empty">페이지를 찾을 수 없습니다.</div>';
  window.scrollTo(0,0);
}

let searchState = { q:'', province:'', founded:'', coordOnly:false, page:1 };
const PAGE_SIZE = 20;

function viewSearch(){
  // 홈에서 쿼리스트링으로 넘어온 검색어 반영
  const hashQuery = location.hash.split('?')[1];
  if(hashQuery){
    const params = new URLSearchParams(hashQuery);
    if(params.get('q')) searchState.q = params.get('q');
    if(params.get('province')) searchState.province = params.get('province');
  }
  return `
    <h1>검색·목록</h1>
    <div class="searchbar">
      <input id="q" type="text" placeholder="사찰명 또는 주소 검색" value="${esc(searchState.q)}">
      <button class="btn" onclick="applySearch()">검색</button>
    </div>
    <div class="filters">
      <label>지역
        <select id="fProvince">
          <option value="">전체</option>
          ${PROVINCES.map(p=>`<option value="${esc(p)}" ${p===searchState.province?'selected':''}>${esc(p)}</option>`).join('')}
        </select>
      </label>
      <label>창립연대
        <select id="fFounded">
          <option value="">전체</option>
          <option value="before1000" ${searchState.founded==='before1000'?'selected':''}>1000년 이전</option>
          <option value="1000-1500" ${searchState.founded==='1000-1500'?'selected':''}>1000~1500년</option>
          <option value="after1500" ${searchState.founded==='after1500'?'selected':''}>1500년 이후</option>
        </select>
      </label>
      <label><input type="checkbox" id="fCoord" ${searchState.coordOnly?'checked':''}> 좌표 확인된 사찰만</label>
      <button class="btn ghost" onclick="applySearch()">필터 적용</button>
    </div>
    <div id="resultArea"></div>
  `;
}

function wireSearch(){
  renderSearchResults();
  document.getElementById('q').addEventListener('keydown', e=>{ if(e.key==='Enter') applySearch(); });
}
function applySearch(){
  searchState.q = document.getElementById('q').value.trim();
  searchState.province = document.getElementById('fProvince').value;
  searchState.founded = document.getElementById('fFounded').value;
  searchState.coordOnly = document.getElementById('fCoord').checked;
  searchState.page = 1;
  renderSearchResults();
}
function filteredTemples(){
  return TEMPLES.filter(t=>{
    if(searchState.q){
      const q = searchState.q;
      const hit = (t.name && t.name.includes(q)) || (t.addr && t.addr.includes(q)) || (t.roadAddr && t.roadAddr.includes(q));
      if(!hit) return false;
    }
    if(searchState.province && t.province !== searchState.province) return false;
    if(searchState.coordOnly && (t.lat==null || t.lon==null)) return false;
    if(searchState.founded){
      const y = extractYear(t.founded);
      if(y==null) return false;
      if(searchState.founded==='before1000' && !(y<1000)) return false;
      if(searchState.founded==='1000-1500' && !(y>=1000 && y<=1500)) return false;
      if(searchState.founded==='after1500' && !(y>1500)) return false;
    }
    return true;
  });
}
function renderSearchResults(){
  const list = filteredTemples();
  const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  searchState.page = Math.min(searchState.page, totalPages);
  const start = (searchState.page-1)*PAGE_SIZE;
  const pageItems = list.slice(start, start+PAGE_SIZE);
  const area = document.getElementById('resultArea');
  if(list.length===0){
    area.innerHTML = '<div class="empty">조건에 맞는 사찰이 없습니다.</div>';
    return;
  }
  area.innerHTML = `
    <p class="result-count">현재 조건에 맞는 사찰 <b>${list.length.toLocaleString()}</b>곳</p>
    <ul class="temple-list">
      ${pageItems.map(t=>`
        <li><a href="#/temple/${t.id}" class="${t.photo?'has-photo':''}">
          ${t.photo?`<img class="t-thumb" src="${esc(t.photo)}" alt="" loading="lazy">`:''}
          <span class="t-main">
            <span class="t-name">${esc(t.name)}${t.lat==null?'<span class="badge placeholder">좌표없음</span>':''}${t.founded?`<span class="badge">${esc(t.founded)}</span>`:''}${(!t.photo && t.photoLinkOut)?'<span class="badge linkout">🔗사진</span>':''}</span>
            <span class="t-addr">${esc(t.addr||'')}</span>
          </span>
        </a></li>
      `).join('')}
    </ul>
    <div class="pager">
      <button ${searchState.page<=1?'disabled':''} onclick="gotoPage(${searchState.page-1})">이전</button>
      <span class="muted" style="align-self:center">${searchState.page} / ${totalPages}</span>
      <button ${searchState.page>=totalPages?'disabled':''} onclick="gotoPage(${searchState.page+1})">다음</button>
    </div>
  `;
}
function gotoPage(p){ searchState.page = p; renderSearchResults(); window.scrollTo(0,0); }

function viewMap(){

    <p class="muted">좌표 정보가 없는 ${(TOTAL-pts.length).toLocaleString()}곳은 지도에 표시되지 않습니다. 목록 검색을 이용해 주세요.</p>
    <div id="kakaoMap"></div>
  `;

function wireMap(){
  const container = document.getElementById('kakaoMap');
  if(!container) return;
  if(typeof kakao === 'undefined' || !kakao.maps){
    container.innerHTML = '<p class="muted" style="padding:16px">카카오맵을 불러오지 못했습니다. 네트워크 연결을 확인해 주세요.</p>';
    return;
  }
  kakao.maps.load(function(){
    const pts = TEMPLES.filter(t=>t.lat!=null && t.lon!=null);
    const map = new kakao.maps.Map(container, {
      center: new kakao.maps.LatLng(36.2, 127.9),
      level: 13
    });
    map.setMinLevel && map.setMinLevel(1);
    const markers = pts.map(p=>{
      const marker = new kakao.maps.Marker({
        position: new kakao.maps.LatLng(p.lat, p.lon),
        title: p.name
      });
      kakao.maps.event.addListener(marker, 'click', ()=>{ location.hash = '#/temple/' + p.id; });
      const iw = new kakao.maps.InfoWindow({ content: `<div style="padding:4px 8px;font-size:12px;white-space:nowrap">${esc(p.name)}</div>`, removable:false });
      kakao.maps.event.addListener(marker, 'mouseover', ()=>{ iw.open(map, marker); });
      kakao.maps.event.addListener(marker, 'mouseout', ()=>{ iw.close(); });
      return marker;
    });
    if(kakao.maps.MarkerClusterer){
      const clusterer = new kakao.maps.MarkerClusterer({
        map, averageCenter: true, minLevel: 7, disableClickZoom: false
      });
      clusterer.addMarkers(markers);
    } else {
      markers.forEach(m=>m.setMap(map));
    }
  });
}

function wireVisitMap(){
  const container = document.getElementById('kakaoVisitMap');
  if(!container) return;
  if(typeof kakao === 'undefined' || !kakao.maps){
    container.innerHTML = '<p class="muted" style="padding:16px">카카오맵을 불러오지 못했습니다. 네트워크 연결을 확인해 주세요.</p>';

      center: new kakao.maps.LatLng(items[0].lat, items[0].lon),
      level: 10
    });
    const bounds = new kakao.maps.LatLngBounds();
    items.forEach(p=>{
      const pos = new kakao.maps.LatLng(p.lat, p.lon);
      const marker = new kakao.maps.Marker({ position: pos, title: p.name });
      marker.setMap(map);
      bounds.extend(pos);
      kakao.maps.event.addListener(marker, 'click', ()=>{ location.hash = '#/temple/' + p.id; });
      const iw = new kakao.maps.InfoWindow({ content: `<div style="padding:4px 8px;font-size:12px;white-space:nowrap">${esc(p.name)}</div>`, removable:false });
      kakao.maps.event.addListener(marker, 'mouseover', ()=>{ iw.open(map, marker); });
      kakao.maps.event.addListener(marker, 'mouseout', ()=>{ iw.close(); });
    });
    if(items.length>1) map.setBounds(bounds);
  });
}

// ---------------- 사찰 상세 ----------------
function findTemple(id){ return TEMPLES.find(t=>t.id===id); }

function viewDetail(id){
  const t = findTemple(id);
  if(!t) return '<div class="empty">해당 사찰 정보를 찾을 수 없습니다.</div>';
  let miniMap = '';

function renderTags(id){
  const area = document.getElementById('tagArea');
  const tags = getTags(id);
  area.innerHTML = tags.length
    ? tags.map(tg=>`<span class="tag-chip">${esc(tg)}<button onclick="removeTagUI(${id},'${esc(tg).replace(/'/g,"\\'")}')">×</button></span>`).join('')
    : '<span class="muted">등록된 태그 없음</span>';
}
function removeTagUI(id, tag){ removeTag(id, tag); renderTags(id); }
function copyCitation(id){
  const t = findTemple(id);
  const today = new Date().toISOString().slice(0,10);
  const text = `${t.name}, ${t.addr||''} (출처: 공공데이터포털 "행정안전부_문화_전통사찰", 확인일: ${today})`;
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(()=>alert('인용 형식이 클립보드에 복사되었습니다.\\n\\n'+text)).catch(()=>alert(text));
  } else {
    alert(text);
  }
}
function wireDetail(id){
  const t = findTemple(id);
  if(!t) return;
  renderTags(id);
  const detailMapEl = document.getElementById('kakaoDetailMap');
  if(detailMapEl && t.lat!=null && t.lon!=null){
    if(typeof kakao === 'undefined' || !kakao.maps){
      detailMapEl.innerHTML = '<p class="muted" style="padding:8px;font-size:12px">지도를 불러오지 못했습니다.</p>';
    } else {
      kakao.maps.load(function(){
        const pos = new kakao.maps.LatLng(t.lat, t.lon);
        const map = new kakao.maps.Map(detailMapEl, { center: pos, level: 4 });
        new kakao.maps.Marker({ position: pos, map });
      });
    }
  }
  const collectBtn = document.getElementById('collectBtn');
  if(collectBtn) collectBtn.addEventListener('click', ()=>{
    toggleCollect(id);
    collectBtn.textContent = isCollected(id) ? '★ 컬렉션에서 제거' : '☆ 컬렉션에 담기';
    collectBtn.className = 'btn ' + (isCollected(id) ? '' : 'secondary');
  });
  const addTagBtn = document.getElementById('addTagBtn');
  if(addTagBtn) addTagBtn.addEventListener('click', ()=>{
    const input = document.getElementById('tagInput');
    addTag(id, input.value); input.value=''; renderTags(id);
  });
  const noteArea = document.getElementById('noteArea');
  if(noteArea) noteArea.addEventListener('input', ()=>{ setNote(id, noteArea.value); });
}

// 연화문(蓮花紋, 연꽃 문양)과 격자문(格子紋)을 재해석해 직접 그린 장식 SVG입니다.
// 한국불교문화사업단(kbuddhism.com)의 '불교 문양' 소개 페이지를 참고했으나,
// 특정 저작물의 그림을 그대로 옮기지 않고 전통 문양의 형태 개념만 반영해 새로 제작했습니다.
function svgLotus(size){
  size = size || 18;
  const angles = [0,45,90,135,180,225,270,315];
  const petal = angles.map(a=>`<ellipse cx="12" cy="7" rx="3" ry="5" transform="rotate(${a} 12 12)" fill="var(--gold)"/>`).join('');
  return `<svg class="lotus-icon" width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true">${petal}<circle cx="12" cy="12" r="2.3" fill="var(--brand)"/></svg>`;
}
function svgLatticeDecor(){
  return `<svg class="lattice-decor" viewBox="0 0 240 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <pattern id="motifLattice" width="24" height="24" patternUnits="userSpaceOnUse">
        <path d="M12,0 L24,12 L12,24 L0,12 Z" fill="none" stroke="var(--gold)" stroke-width="1"/>
        <circle cx="12" cy="12" r="2" fill="var(--gold)"/>
      </pattern>
    </defs>
    <rect width="240" height="100" fill="url(#motifLattice)"/>
  </svg>`;
}
function groupByRegion(list, key){
  const order = ['서울','경기','인천','강원','충북','충남','대전','세종','경북','경남','대구','부산','울산','전북','전남','광주','제주'];
  const groups = {};
  list.forEach(item=>{
    const prov = order.find(o=> item[key].startsWith(o)) || '기타';
    (groups[prov] = groups[prov] || []).push(item);
  });
  const out = order.filter(o=>groups[o]).map(o=>({region:o, items:groups[o]}));
  if(groups['기타']) out.push({region:'기타', items:groups['기타']});
  return out;
}
